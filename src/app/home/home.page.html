<ion-header>
  <ion-toolbar>
    <ion-title>Pokédex</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-grid>
    <ion-row>
      <ion-col size="6" *ngFor="let pokemon of pokemons">
        <ion-card>
          <img [src]="getImageUrl(pokemon)" alt="{{ pokemon.name }}" />
          <ion-card-header>
            <ion-card-title>
              <a (click)="goToDetails(pokemon.name)">
                {{ pokemon.name | titlecase }}
              </a>
            </ion-card-title>
            <ion-card-subtitle>
              <span *ngIf="pokemon.details">
                Type: {{ getPokemonTypes(pokemon) }}
              </span>
            </ion-card-subtitle>
          </ion-card-header>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>

  <ion-infinite-scroll (ionInfinite)="loadPokemons($event)" threshold="100px">
    <ion-infinite-scroll-content
      loadingSpinner="bubbles"
      loadingText="Cargando más Pokémon...">
    </ion-infinite-scroll-content>
  </ion-infinite-scroll>
</ion-content>
