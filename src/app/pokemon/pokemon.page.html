<ion-header>
  <ion-toolbar>
    <ion-title>{{ pokemon?.name | titlecase }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content *ngIf="pokemon">
  <ion-card>
    <img [src]="pokemon.sprites?.front_default" alt="imagen" />

    <ion-card-header>
      <ion-card-title>{{ pokemon.name | titlecase }}</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <p><strong>Altura:</strong> {{ pokemon.height / 10 }} m</p>
      <p><strong>Peso:</strong> {{ pokemon.weight / 10 }} kg</p>

      <p><strong>Tipos:</strong>
        <span *ngFor="let tipo of pokemon.types; let last = last">
          {{ tipo.type.name }}<span *ngIf="!last">, </span>
        </span>
      </p>

      <p><strong>Habilidades:</strong>
        <span *ngFor="let habilidad of pokemon.abilities; let last = last">
          {{ habilidad.ability.name }}<span *ngIf="!last">, </span>
        </span>
      </p>

      <p><strong>Estadísticas:</strong></p>
      <ul>
        <li *ngFor="let stat of pokemon.stats">
          {{ stat.stat.name }}: {{ stat.base_stat }}
        </li>
      </ul>
    </ion-card-content>
  </ion-card>
</ion-content>
